services:
  database:
    image: postgres:16-alpine
    container_name: market_intelligence_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secret_key}
      POSTGRES_DB: ${POSTGRES_DB:-market_intelligence}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-market_intelligence}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - market_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: market_intelligence_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin_secret_key}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - database
    networks:
      - market_network

volumes:
  postgres_data:
    driver: local

networks:
  market_network:
    driver: bridge
