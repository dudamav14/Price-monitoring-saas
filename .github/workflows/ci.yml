name: Market Intelligence SaaS - CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-checks:
    name: Backend Node.js Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci || npm install

      - name: TypeScript Build Check
        run: |
          cd backend
          npm run build

  frontend-checks:
    name: Frontend React Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: TypeScript & Vite Production Build
        run: |
          cd frontend
          npm run build

  ai-services-checks:
    name: Python AI Microservice Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          cd ai-services
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python Syntax
        run: |
          python -m py_compile ai-services/run_pipeline.py
          python -m py_compile ai-services/app/main.py
